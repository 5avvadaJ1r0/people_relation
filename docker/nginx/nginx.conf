# Docker Compose 開発向け（upstream は compose のサービス名）。本番運用では別途用意した設定を使うこと。

map $http_user_agent $is_social_crawler {
  default 0;
  ~*(Twitterbot|facebookexternalhit|LinkedInBot|Slackbot|Discordbot) 1;
}

# SNS クローラ + diagram_share_id クエリ時のみカード HTML へ（if + proxy_pass を避ける）
map "$is_social_crawler:$arg_diagram_share_id" $diagram_share_card_route {
  default 0;
  "~^1:.+" 1;
}

server {
  listen 8080;

  client_max_body_size 20m;

  location /api/ {
    # /api/* を FastAPI の /api/* にそのまま転送する
    proxy_pass http://api:8000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location @diagram_share_card {
    proxy_pass http://api:8000/api/v1/diagram/share/$arg_diagram_share_id/card;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location / {
    error_page 418 = @diagram_share_card;
    if ($diagram_share_card_route) {
      return 418;
    }

    proxy_pass http://frontend:5173/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}
