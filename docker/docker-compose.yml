services:
  postgres:
    image: postgres:18-alpine
    env_file:
      - ../.env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-people_relation}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required (set it in .env)}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ../doc:/doc:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-people_relation}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ../backend
      dockerfile: ../docker/backend/Dockerfile
    env_file:
      - ../.env
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required (set it in .env)}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:5173}
      # 相関図 URL 共有（未設定時は POST /diagram/share が 503）
      DIAGRAM_SHARE_SECRET_KEY: ${DIAGRAM_SHARE_SECRET_KEY:-}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:8080}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8080/api}
    volumes:
      - ../backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ../frontend
      dockerfile: ../docker/frontend/Dockerfile
    env_file:
      - ../.env
    environment:
      # 省略時は同一オリジン（nginx 経由の /api）。CDN＋別API検証時は .env で絶対URLを指定
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
      # Vite dev サーバの /api プロキシ先（compose 内では api サービス名を使う）
      VITE_DEV_PROXY_TARGET: ${VITE_DEV_PROXY_TARGET:-http://api:8000}
    volumes:
      - ../frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"

  nginx:
    build:
      context: ..
      dockerfile: docker/nginx/Dockerfile
    depends_on:
      - api
      - frontend
    ports:
      - "8080:8080"

  # 画面の「関連者を探す」と同じ処理を、未実行主体の person に対してバックグラウンドで繰り返す
  relation_extract_worker:
    build:
      context: ../backend
      dockerfile: ../docker/backend/Dockerfile
    env_file:
      - ../.env
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required (set it in .env)}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    volumes:
      - ../backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command:
      - python
      - -m
      - app.worker.relation_extract
      - --pid-file
      - /tmp/relation_extract_worker.pid
    restart: unless-stopped

volumes:
  postgres_data:
  frontend_node_modules:
