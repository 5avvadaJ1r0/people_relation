# fork 由来の PR では pull_request イベントではリポジトリ secrets が渡らないため、
# 同一リポジトリ内のブランチ PR のみを対象とする。
#
# プロバイダ切替: Settings > Secrets and variables > Actions > Variables
#   PR_REVIEW_PROVIDER = nim | gemini  （未設定時は nim）
name: AI PR review

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ai-pr-review-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ai-review:
    runs-on: ubuntu-latest
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.fork == false

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_REVIEW_PROVIDER: ${{ vars.PR_REVIEW_PROVIDER }}
      NIM_MODEL: ${{ vars.NIM_MODEL }}
      NIM_API_BASE_URL: ${{ vars.NIM_API_BASE_URL }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      GEMINI_API_BASE_URL: ${{ vars.GEMINI_API_BASE_URL }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Resolve PR review provider
        id: provider
        run: |
          raw="${PR_REVIEW_PROVIDER:-nim}"
          raw="$(printf '%s' "$raw" | tr '[:upper:]' '[:lower:]' | xargs)"
          case "$raw" in
            nim|gemini)
              echo "name=$raw" >> "$GITHUB_OUTPUT"
              ;;
            "")
              echo "name=nim" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::warning::PR_REVIEW_PROVIDER が不明です ($raw)。nim を使用します。"
              echo "name=nim" >> "$GITHUB_OUTPUT"
              ;;
          esac
          echo "PR review provider: $(grep '^name=' "$GITHUB_OUTPUT" | cut -d= -f2-)"

      - name: Check API key (NIM)
        id: nim_key
        if: steps.provider.outputs.name == 'nim'
        run: |
          if [ -n "${NVIDIA_API_KEY}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::NVIDIA_API_KEY が未設定です。Settings > Secrets and variables > Actions に NVIDIA_API_KEY を追加してください。"
          fi

      - name: Check API key (Gemini)
        id: gemini_key
        if: steps.provider.outputs.name == 'gemini'
        run: |
          if [ -n "${GEMINI_API_KEY}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GEMINI_API_KEY が未設定です。Settings > Secrets and variables > Actions に GEMINI_API_KEY を追加してください。"
          fi

      - uses: reviewdog/action-setup@v1
        if: >-
          (steps.provider.outputs.name == 'nim' && steps.nim_key.outputs.present == 'true') ||
          (steps.provider.outputs.name == 'gemini' && steps.gemini_key.outputs.present == 'true')

      - name: Run NVIDIA NIM review (reviewdog inline comments)
        if: steps.provider.outputs.name == 'nim' && steps.nim_key.outputs.present == 'true'
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 .github/scripts/nim_pr_review.py |
            reviewdog \
              -f=rdjson \
              -name="nvidia-nim" \
              -reporter=github-pr-review \
              -filter-mode=diff_context \
              -level=warning

      - name: Run Gemini review (reviewdog inline comments)
        if: steps.provider.outputs.name == 'gemini' && steps.gemini_key.outputs.present == 'true'
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 .github/scripts/gemini_pr_review.py |
            reviewdog \
              -f=rdjson \
              -name="gemini" \
              -reporter=github-pr-review \
              -filter-mode=diff_context \
              -level=warning
