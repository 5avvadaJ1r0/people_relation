# fork 由来の PR では通常の pull_request では secrets が渡らない。
# pull_request_target はベース側のコンテキストで secrets を使えるが、PR 先のコードを
# checkout・実行しない運用に限る（本ワークフローは gh pr diff + リポジトリ同梱のスクリプトのみ）。
name: Gemini PR review

on:
  pull_request:
    types: [opened, reopened]
  pull_request_target:
    types: [opened, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: gemini-pr-review-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gemini-review:
    runs-on: ubuntu-latest
    if: >-
      github.event.pull_request.draft == false &&
      (
        (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false) ||
        (github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.fork == true)
      )

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}

    steps:
      - uses: actions/checkout@v6

      - name: Check GEMINI_API_KEY
        id: gemini_key
        run: |
          if [ -n "${GEMINI_API_KEY}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GEMINI_API_KEY が未設定です。Settings > Secrets and variables > Actions に GEMINI_API_KEY を追加してください。"
          fi

      - name: Run Gemini review
        if: steps.gemini_key.outputs.present == 'true'
        run: python3 .github/scripts/gemini_pr_review.py
